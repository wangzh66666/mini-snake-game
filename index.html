<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="一个简洁、响应式的网页版贪吃蛇游戏" />
    <title>贪吃蛇 · Snake</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="game-shell">
      <header class="hero">
        <div>
          <p class="eyebrow">CLASSIC ARCADE</p>
          <h1>贪吃蛇<span>.</span></h1>
        </div>
        <p class="tagline">保持专注，吃掉果实，<br />看看你能走多远。</p>
      </header>

      <section class="scoreboard" aria-label="游戏得分">
        <div class="score-item">
          <span>当前得分</span>
          <strong id="score">000</strong>
        </div>
        <div class="divider" aria-hidden="true"></div>
        <div class="score-item">
          <span>最高纪录</span>
          <strong id="high-score">000</strong>
        </div>
        <div class="status-pill"><i></i><span id="status-text">准备就绪</span></div>
      </section>

      <section class="board-wrap">
        <canvas id="game-board" width="480" height="480" aria-label="贪吃蛇游戏区域"></canvas>
        <div class="game-overlay" id="game-overlay">
          <div class="overlay-icon" aria-hidden="true">↗</div>
          <p class="overlay-label" id="overlay-label">准备好了吗？</p>
          <h2 id="overlay-title">开始挑战</h2>
          <p id="overlay-message">使用方向键控制小蛇，<br />吃掉果实并避开墙壁。</p>
          <button class="primary-button" id="start-button" type="button">开始游戏 <span>→</span></button>
        </div>
      </section>

      <section class="controls" aria-label="游戏控制">
        <div class="control-tip">
          <div class="key-grid" aria-hidden="true">
            <kbd>↑</kbd><kbd>←</kbd><kbd>↓</kbd><kbd>→</kbd>
          </div>
          <p><strong>移动</strong><span>方向键 / WASD</span></p>
        </div>
        <button class="pause-button" id="pause-button" type="button" disabled>
          <span id="pause-icon">Ⅱ</span><span id="pause-label">暂停</span>
        </button>
        <div class="mobile-pad" aria-label="触屏方向控制">
          <button data-direction="up" aria-label="向上">↑</button>
          <button data-direction="left" aria-label="向左">←</button>
          <button data-direction="down" aria-label="向下">↓</button>
          <button data-direction="right" aria-label="向右">→</button>
        </div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
